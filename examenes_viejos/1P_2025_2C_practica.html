<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1° parcial 2C 2025 — BD2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e8ebef; --card:#f7f9fa; --ink:#141c24; --soft:#5d6b78;
  --rule:#c6ced7; --rule-strong:#9aa6b2;
  --seal:#27496f; --seal-ink:#fff;
  --ok:#1c6b48; --bad:#a43029; --ok-bg:#dceade; --bad-bg:#f4ddda;
  --serif:Spectral,Georgia,'Times New Roman',serif;
  --sans:Archivo,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#11161c; --card:#1a2029; --ink:#e4e9ee; --soft:#95a2b0;
  --rule:#2c3541; --rule-strong:#4a5766;
  --seal:#7fb0dd; --seal-ink:#0e1319;
  --ok:#6cc194; --bad:#e3877f; --ok-bg:#16301f; --bad-bg:#341a1a;
}}
:root[data-theme=dark]{
  --paper:#11161c; --card:#1a2029; --ink:#e4e9ee; --soft:#95a2b0;
  --rule:#2c3541; --rule-strong:#4a5766;
  --seal:#7fb0dd; --seal-ink:#0e1319;
  --ok:#6cc194; --bad:#e3877f; --ok-bg:#16301f; --bad-bg:#341a1a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.6}
main{width:min(720px,calc(100% - 28px));margin:0 auto;padding:32px 0 64px}

h1{font-family:var(--sans);font-weight:700;font-size:clamp(22px,4.6vw,30px);
  letter-spacing:-.02em;margin:0 0 16px;line-height:1.1}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
button{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule-strong);border-radius:3px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--seal);color:var(--seal-ink);border-color:var(--seal);font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.12)}
button:focus-visible,.opt:focus-visible,textarea:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.spacer{margin-left:auto}

/* progreso */
.track{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:6px}
.fill{height:100%;width:0;background:var(--seal);transition:width .25s ease}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.pos{font-family:var(--sans);font-size:12.5px;color:var(--soft);
  display:flex;gap:14px;margin-bottom:16px}
.pos b{color:var(--ink);font-weight:600}

/* tarjeta */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:26px 24px}
.prompt{font-size:19px;margin:0 0 18px;max-width:60ch}
.prompt p{margin:0 0 10px}
pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5;
  background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;
  margin:0 0 12px;overflow-x:auto;white-space:pre}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.prompt pre{max-width:none}
.why{margin-top:8px;color:var(--soft)}
.card img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:4px;margin-bottom:18px}
.opts{margin:0 0 4px;padding:0;list-style:none}
.opt{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;margin-bottom:4px;
  border:1px solid transparent;border-radius:4px;cursor:pointer}
.opt:hover{background:var(--paper)}
.dot{flex:0 0 auto;width:18px;height:18px;margin-top:3px;background:var(--paper);
  border:1.5px solid var(--rule-strong);position:relative}
.dot.round{border-radius:50%}
.dot:not(.round){border-radius:3px}
.opt.sel .dot{background:var(--seal);border-color:var(--seal)}
.opt.sel .dot.round::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--seal-ink)}
.opt.sel .dot:not(.round)::after{content:"";position:absolute;left:5.5px;top:1.5px;width:4px;height:9px;
  border:solid var(--seal-ink);border-width:0 2px 2px 0;transform:rotate(42deg)}
.ltr{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--soft);margin-top:4px;min-width:15px}
.opt.hit{background:var(--ok-bg);border-color:var(--ok)}
.opt.miss{background:var(--ok-bg);border-color:var(--ok);border-style:dashed}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
textarea{font-family:var(--serif);font-size:16px;color:var(--ink);width:100%;min-height:120px;
  background:var(--paper);border:1px solid var(--rule-strong);border-radius:4px;padding:11px;resize:vertical}

.fb{margin-top:16px;padding:13px 15px;border-radius:5px;border-left:3px solid var(--seal);
  background:var(--paper);font-size:16px}
.fb.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.fb>strong:first-child{font-family:var(--sans);font-size:13px;display:block;margin-bottom:5px}
.fb li>strong,.fb p>strong{font-weight:600}
.fb p{margin:0 0 8px}
.fb p:last-child{margin-bottom:0}
.fb ul{margin:0 0 8px;padding-left:20px}
.fb li{margin:3px 0}
.self{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.self span{font-family:var(--sans);font-size:12.5px;color:var(--soft)}
button.on{background:var(--seal);color:var(--seal-ink);border-color:var(--seal);font-weight:600}
.acts{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;align-items:center}

/* resultado */
.res h2{font-family:var(--sans);font-size:20px;margin:0 0 18px}
.nums{display:flex;gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:20px}
.nums div{flex:1;padding:14px 12px 14px 0}
.nums b{display:block;font-family:var(--sans);font-size:30px;font-weight:600;line-height:1.1}
.nums span{font-family:var(--sans);font-size:12px;color:var(--soft)}
.nums .g b{color:var(--ok)} .nums .r b{color:var(--bad)}
.res p{margin:0 0 18px;color:var(--soft);font-size:16px}
@media(max-width:560px){.prompt{font-size:18px}.card{padding:20px 16px}.nums b{font-size:24px}}
</style>
</head>
<body>
<main>
  <h1>1° parcial 2C 2025 — BD2</h1>
  <div class="tools">
    <button id="mezclar">Mezclar</button>
    <button id="reiniciar">Empezar de nuevo</button>
    <button id="terminar">Ver resultado</button>
    <button id="tema" class="spacer">Modo oscuro</button>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="pos" id="pos"></div>
  <div id="pantalla"></div>
</main>

<script id="datos" type="application/json">[{"stmt": "1. Dadas las siguientes definiciones de vistas en MySQL, para la siguiente sentencia, considerando la existencia de la tabla Movimiento y suponiendo que está inicialmente vacía y que los datos que se pretende insertar satisfacen las restricciones de integridad referencial definidas, indique si la operación procede o no.\n```sql\nCREATE VIEW MovimientoUSDT AS\nSELECT id_usuario, moneda, fecha, tipo, comision, valor\nFROM Movimiento\nWHERE moneda LIKE '%USDT%';\n\nCREATE VIEW MovUSDTValor AS\nSELECT * FROM MovimientoUSDT\nWHERE valor < 1200\nWITH LOCAL CHECK OPTION;\n\nCREATE VIEW MovUSDTValorComi AS\nSELECT * FROM MovUSDTValor\nWHERE comision < 25\nWITH CASCADED CHECK OPTION;\n\nINSERT INTO MovUSDTValorComi (id_usuario, moneda, fecha, tipo, comision, valor)\nVALUES ('2', 'EURO', to_date('2020-02-02','yyyy-MM-dd'), 'E', 20, 1000);\n```", "img": [], "mc": true, "opts": ["Procede", "No procede"], "correct": [1], "why": "_CASCADED chequea las condiciones de todas las vistas de abajo, aunque no tengan CHECK OPTION. `comision < 25` y `valor < 1200` se cumplen, pero 'EURO' no cumple `moneda LIKE '%USDT%'`._"}, {"stmt": "2. En MySQL, el `EXPLAIN ANALYZE <sql>` muestra los tiempos de planificación, pero no ejecuta la sentencia `<sql>`.", "img": [], "mc": true, "opts": ["Verdadero", "Falso"], "correct": [1], "why": "_EXPLAIN ANALYZE sí ejecuta la sentencia: por eso puede mostrar los tiempos reales. El que no la ejecuta es EXPLAIN a secas._"}, {"stmt": "3. Suponga que tiene una base de datos distribuida en varios nodos y todos los nodos aceptan lecturas y escrituras. ¿En qué situación del teorema CAP estaríamos?", "img": [], "mc": true, "opts": ["CP", "AP", "CA", "Ninguna de las anteriores"], "correct": [1], "why": ""}, {"stmt": "4. Imagine un ambiente HA en Neo4j, donde se levantan 3 nodos. Se ingresa al shell del servidor 2 y se crea a Homero; después se ingresa al servidor 3, se crea a Bart y se ejecuta el MATCH. ¿Cuál es el resultado del query?\n```\n$ neo4j-1.local/bin/neo4j start\n$ neo4j-2.local/bin/neo4j start\n$ neo4j-3.local/bin/neo4j start\n\n$ neo4j-2.local/bin/cypher-shell\nneo4j> CREATE (p:Person {name: \"Homero\"});\nneo4j> :exit\n\n$ neo4j-3.local/bin/cypher-shell\nneo4j> CREATE (p:Person {name: \"Bart\"});\nneo4j> match (n) return n;\n```", "img": [], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\nDevuelve **los dos nodos**: `(:Person {name: \"Homero\"})` y `(:Person {name: \"Bart\"})`.\n\nEn un cluster HA los 3 servidores comparten la misma base: las escrituras van al master y se replican a todos. Lo que se crea en el servidor 2 también se ve desde el servidor 3."}, {"stmt": "5. Elija la respuesta correcta de acuerdo a la definición dada.\n1. Usar diferentes tipos de base de datos para almacenar datos, de acuerdo a las distintas necesidades de almacenamiento que requiera una aplicación de software en particular.\n2. Aplicaciones pueden ser codificadas en una mezcla de diferentes lenguajes de programación, para aprovechar el uso del lenguaje más adecuado para resolver la necesidad requerida.", "img": [], "mc": false, "ansimg": [], "ans": "- **1)** Persistencia políglota\n- **2)** Programación políglota\n\n_El distractor que aparecía era \"Programación múltiple\". Ver [[0_Persistencia-poliglota-docker#Persistencia poliglota]]._"}, {"stmt": "6. Supongamos una colección 'orders' en una instancia de MongoDB. Calcular el total vendido por product usando la estrategia Map-Reduce.\n```javascript\n{ \"_id\": 1, \"product\": \"laptop\",   \"quantity\": 2, \"price\": 1000 }\n{ \"_id\": 2, \"product\": \"mouse\",    \"quantity\": 5, \"price\": 50 }\n{ \"_id\": 3, \"product\": \"laptop\",   \"quantity\": 1, \"price\": 1000 }\n{ \"_id\": 4, \"product\": \"keyboard\", \"quantity\": 3, \"price\": 80 }\n```", "img": [], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\n`map` emite por cada orden la clave `product` y el importe `quantity * price`; `reduce` suma los importes de cada clave.\n\n```javascript\ndb.orders.mapReduce(\n  function () { emit(this.product, this.quantity * this.price); },\n  function (key, values) { return Array.sum(values); },\n  { out: \"total_por_producto\" }\n);\ndb.total_por_producto.find();\n```\n\nResultado:\n\n- **laptop**: 2·1000 + 1·1000 = 3000\n- **mouse**: 5·50 = 250\n- **keyboard**: 3·80 = 240\n\nSi \"total vendido\" se interpreta como unidades, se emite `this.quantity`: laptop 3, mouse 5, keyboard 3."}, {"stmt": "7. Relacione cada término de Cassandra con su equivalente en el modelo relacional.\n1. Keyspace\n2. Column Family\n3. Fila\n4. Columna\n5. Cluster", "img": [], "mc": false, "ansimg": [], "ans": "- **Keyspace** → Base de datos\n- **Column Family** → Tabla\n- **Fila** → Fila\n- **Columna** → Columna\n- **Cluster** → Instancia\n\n_Ver [[8_Cassandra#Bases de datos tabulares]]._"}, {"stmt": "8. Los componentes de un nodo de Cassandra son:", "img": [], "mc": true, "opts": ["SSTable", "Memtable", "Commit Log", "Memory space", "Disk table", "Ninguna de las opciones."], "correct": [0, 1, 2], "why": ""}, {"stmt": "9. ¿Cuál es el tipo de índice default que maneja MongoDB? ¿Hay índices creados por default como ocurría en MySQL? En caso de que la respuesta a la 2da pregunta sea afirmativa, ¿sobre qué campo lo aplica?", "img": [], "mc": true, "opts": ["B-Tree - Si - _id", "Hash index - Si - _id", "B-Tree - No", "Hash index - No", "2d index - Si - _id", "2d index - No"], "correct": [0], "why": ""}, {"stmt": "10. MongoDB es AP según el teorema CAP.", "img": [], "mc": true, "opts": ["Verdadero", "Falso"], "correct": [1], "why": "_MongoDB es CP._"}, {"stmt": "11. La vista materializada en MySQL provee un nivel de abstracción, pero NO trae ninguna mejora en la performance vs. ejecutar el mismo select que la define.", "img": [], "mc": true, "opts": ["Verdadero", "Falso"], "correct": [1], "why": "_La vista materializada guarda el resultado, así que consultarla no re-ejecuta el select. Ver [[2_Vistas#Vistas materializadas - PostgreSQL]]._"}, {"stmt": "12. ¿A qué se puede deber la siguiente salida al ejecutar el EXPLAIN sobre la siguiente consulta en MySQL?\n```sql\nSELECT *\nFROM materia INNER JOIN inscripto\nON materia.codigo = inscripto.codigo;\n```", "img": ["bd2-parcial-2025-explain-join.png"], "mc": true, "opts": ["codigo en Materia es PK", "codigo en Inscripto es PK", "codigo en Materia tiene definido un índice UNIQUE", "codigo en Inscripto tiene definido un índice UNIQUE", "Ninguna de las opciones"], "correct": [0, 2], "why": "_El \"Unique Index Scan (Single-row index lookup)\" se hace sobre materia, e inscripto se recorre con Full Scan. Para cada inscripto se busca una única materia, lo que solo pasa si codigo es PK o UNIQUE en Materia._"}, {"stmt": "13. Elija ejemplos de las bases de datos vistas en clase que funcionan bajo la configuración CA.", "img": [], "mc": true, "opts": ["MySQL", "Neo4j", "Cassandra", "MongoDB", "Ninguna de las opciones."], "correct": [0, 1], "why": ""}, {"stmt": "14. En Cassandra SSTable es una estructura de datos residente en la memoria.", "img": [], "mc": true, "opts": ["Verdadero", "Falso"], "correct": [1], "why": "_La SSTable es un archivo en disco e inmutable. La que vive en memoria es la MemTable. Ver [[8_Cassandra#Almacenamiento: Commit log, MemTable y SSTable]]._"}, {"stmt": "15. Interprete y explique con sus palabras qué hace la siguiente query de MongoDB:\n```javascript\ndb.orders.aggregate([\n  { $match: { payment_method: \"cash\" } },\n  { $group: { _id: \"$order_date\", totalQuantity: { $sum: \"$quantity\" } } }\n])\n```", "img": [], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\nEs un pipeline de agregación de dos etapas:\n\n- **$match**: se queda solo con las órdenes pagadas en efectivo (`payment_method = \"cash\"`). Es el WHERE.\n- **$group**: agrupa esas órdenes por `order_date` y suma `quantity` en el campo `totalQuantity`. Es el GROUP BY con SUM.\n\nDevuelve un documento por fecha, `{ _id: <fecha>, totalQuantity: <total> }`, con la cantidad total de unidades vendidas en efectivo cada día. En SQL:\n\n```sql\nSELECT order_date, SUM(quantity) AS totalQuantity\nFROM orders WHERE payment_method = 'cash'\nGROUP BY order_date;\n```"}, {"stmt": "16. Considerando el siguiente esquema de BD, provea una consulta en MySQL que devuelva una lista con los datos de aquellas obras en ejecución junto con una columna denominada \"Resp_obra\" donde figure el arquitecto o ingeniero responsable de la obra, según sea su tipo.", "img": ["bd2-parcial-2025-esquema-obras.png"], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\nUna obra en ejecución es una obra todavía sin `anio_finalizacion` (es el único campo nullable con `N`). El responsable está en OBRA_PRIVADA (`arquitecto`) o en OBRA_CIVIL (`ingeniero_resp`), según el tipo. Se resuelve con dos LEFT JOIN y COALESCE:\n\n```sql\nSELECT o.*, COALESCE(op.arquitecto, oc.ingeniero_resp) AS Resp_obra\nFROM obra o\nLEFT JOIN obra_privada op ON op.id_obra = o.id_obra\nLEFT JOIN obra_civil   oc ON oc.id_obra = o.id_obra\nWHERE o.anio_finalizacion IS NULL;\n```\n\nOtra forma es un UNION de dos SELECT, uno con JOIN a obra_privada y otro con JOIN a obra_civil, cada uno con su columna renombrada `AS Resp_obra`."}, {"stmt": "17. Considere en MySQL las tablas a continuación con sus atributos y datos relevantes, con sus claves primarias, sus restricciones de integridad referencial (RIR) y acciones referenciales de [baja, modificación]. Determine el resultado de la ejecución de la siguiente operación.\nR1: Carrera (idFac) << Facultad (idFac): [restrict, restrict]\nR2: Materia (carrera, facultad) << Carrera (idCarr, idFac): [restrict, cascade]\nNota: respecto de la RIR R2, suponga que los atributos carrera y facultad admiten nulos.\n```sql\nUPDATE carrera SET idFac='F1' WHERE idFac='F2';\n```", "img": ["bd2-parcial-2025-tablas-rir.png"], "mc": true, "opts": ["Procede", "No procede por RIR R1", "No procede por RIR R2", "No procede por restricción de unicidad", "No procede por restricción de integridad referencial"], "correct": [3], "why": "_La PK de Carrera es (idCarr, idFac). La fila (1, F2) pasaría a ser (1, F1), que ya existe. R1 no molesta porque F1 existe en Facultad, y R2 tiene cascade en la modificación._"}, {"stmt": "18. Dadas las siguientes definiciones de vistas en MySQL, para la siguiente sentencia, considerando la existencia de la tabla Movimiento y suponiendo que está inicialmente vacía y que los datos que se pretende insertar satisfacen las restricciones de integridad referencial definidas, indique si la operación procede o no.\n```sql\nCREATE VIEW MovimientoUSDT AS\nSELECT id_usuario, moneda, fecha, tipo, comision, valor\nFROM Movimiento\nWHERE moneda LIKE '%USDT%';\n\nCREATE VIEW MovUSDTValor AS\nSELECT * FROM MovimientoUSDT\nWHERE valor < 1200\nWITH LOCAL CHECK OPTION;\n\nCREATE VIEW MovUSDTValorComi AS\nSELECT * FROM MovUSDTValor\nWHERE comision < 25\nWITH CASCADED CHECK OPTION;\n\nINSERT INTO MovUSDTValor (id_usuario, moneda, fecha, tipo, comision, valor)\nVALUES ('3', 'BITCOIN', to_date('2020-03-03','yyyy-MM-dd'), 'S', 30, 700);\n```", "img": [], "mc": true, "opts": ["Procede", "No procede"], "correct": [0], "why": "_LOCAL solo chequea la condición de la propia vista (`valor < 1200`, se cumple) y la de las vistas de abajo que tengan su propio CHECK OPTION. MovimientoUSDT no tiene, así que 'BITCOIN' no se valida. `comision = 30` no importa porque se inserta en MovUSDTValor, no en MovUSDTValorComi._"}, {"stmt": "19. Considere en MySQL las tablas a continuación con sus atributos y datos relevantes, con sus claves primarias, sus restricciones de integridad referencial (RIR) y acciones referenciales de [baja, modificación]. Determine el resultado de la ejecución de la siguiente operación.\nR1: Carrera (idFac) << Facultad (idFac): [restrict, restrict]\nR2: Materia (carrera, facultad) << Carrera (idCarr, idFac): [restrict, cascade]\nNota: respecto de la RIR R2, suponga que los atributos carrera y facultad admiten nulos.\n```sql\nINSERT INTO Materia (idM, carrera, facultad, nom) VALUES ('M4', 3, null, 'nom4');\n```", "img": ["bd2-parcial-2025-tablas-rir.png"], "mc": true, "opts": ["Procede", "No procede por RIR R1", "No procede por RIR R2", "Procede con MATCH simple", "Procede con MATCH parcial", "Procede con MATCH full", "No procede por restricción de unicidad"], "correct": [3], "why": "_Con MATCH simple, basta un componente NULL para que la FK no se chequee. Con MATCH parcial tendría que existir una carrera 3 (no existe), y con MATCH full tendrían que ser todos NULL. Ver [[4_restricciones-de-integridad#Tipos de matching]]._"}, {"stmt": "20. Escriba la sentencia en Cypher que permita crear una restricción de unicidad en el modelo de datos de una base Neo4j. Tome como ejemplo un nodo Publication que tiene una propiedad llamada name a la cual queremos agregarle la restricción de unicidad.", "img": [], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\n```\nCREATE CONSTRAINT ON (p:Publication) ASSERT p.name IS UNIQUE;\n```\n\nEsa es la sintaxis clásica. Desde Neo4j 4.4/5 es:\n\n```\nCREATE CONSTRAINT publication_name FOR (p:Publication) REQUIRE p.name IS UNIQUE;\n```"}, {"stmt": "21. ¿Qué diferencia existe entre Replicación y Sharding?", "img": [], "mc": true, "opts": ["El sharding busca garantizar que siempre haya copias de los datos disponibles y permite escalar una base de datos distribuida horizontalmente. La replicación persigue exactamente lo mismo.", "La replicación busca garantizar que siempre haya copias de los datos disponibles, mientras que el sharding permite escalar una base de datos distribuida horizontalmente.", "El sharding busca garantizar que siempre haya copias de los datos disponibles, mientras que la replicación permite escalar una base de datos distribuida horizontalmente.", "Ninguna de las opciones."], "correct": [1], "why": ""}, {"stmt": "22. Redacte en lenguaje natural la pregunta que le solicitan responder para construir la siguiente consulta sobre una base en Neo4j:\n```\nMATCH (actor:Person)-[:ACTED_IN]->(movie:Movie)\nWHERE movie.title STARTS WITH \"T\"\nRETURN movie.title AS title, count(actor.name) AS cant\nORDER BY title ASC LIMIT 10;\n```", "img": [], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\n\"¿Cuántos actores actuaron en cada película cuyo título empieza con T? Mostrar las primeras 10, ordenadas alfabéticamente por título.\""}, {"stmt": "23. Imagine el siguiente esquema en Cassandra. ¿Qué sucede si ejecutamos la siguiente query?\n```sql\nCREATE TABLE blogs (blogId int, time1 int, time2 int, author text, content text,\n                    PRIMARY KEY (blogId, time1, time2));\n\nSELECT * FROM blogs WHERE time1 = 1418306451235;\n```", "img": [], "mc": true, "opts": ["Obtenemos los datos de blogs que se cargaron en el time1 = 1418306451235", "Falla porque no se puede filtrar por time1 solamente", "Falla porque no incluye blogId en el WHERE", "Obtenemos los datos de blogs que se cargaron en el time1 = 1418306451235 siempre y cuando agreguemos la palabra reservada ALLOW FILTERING", "Ninguna de las opciones"], "correct": [1, 2, 3], "why": "_Ver [[8_Cassandra#ALLOW FILTERING]]._"}, {"stmt": "24. Si tuvieras que especificar una restricción de tabla, ¿cómo la implementarías teniendo en cuenta SQL estándar primero y luego MySQL?", "img": [], "mc": true, "opts": ["1. CHECK 2. CHECK", "1. CHECK 2. ASSERTION", "1. ASSERTION 2. CHECK", "1. CHECK 2. TRIGGER", "1. TRIGGER 2. TRIGGER"], "correct": [3], "why": ""}, {"stmt": "25. Imagine que tiene una tabla Empleado en MySQL y alguien agrega posteriormente a la creación la siguiente restricción. 1) ¿Podría indicar qué hace la restricción? 2) ¿De qué tipo es? 3) ¿Aplica a datos ya almacenados o solo para datos que se inserten luego de haber creado la restricción?\n```sql\nALTER TABLE Empleado ADD CONSTRAINT chk_sueldo_comision\nCHECK ( (sueldo > 5000 AND comision = 0) OR (sueldo <= 5000) );\n```", "img": [], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\n- **Qué hace:** un empleado que cobra más de 5000 no puede tener comisión (tiene que ser 0). Los que cobran 5000 o menos pueden tener cualquier comisión.\n- **Tipo:** declarativa (CHECK), explícita, de estado y a nivel de **tupla**, porque relaciona dos atributos de la misma fila.\n- **Datos almacenados:** al ser declarativa, también valida lo que ya está guardado. Si alguna fila existente la viola, el ALTER TABLE falla. Una procedural (trigger) solo actuaría sobre los datos nuevos.\n\n_Ver [[4_restricciones-de-integridad#Restricciones del administrador]]._"}, {"stmt": "26. Para gestionar el nivel de consistencia en Cassandra, el QUORUM se calcula de la siguiente manera:", "img": [], "mc": true, "opts": ["QUORUM = replication_factor*2 +1", "QUORUM = replication_factor*replicación_factor", "QUORUM = replication_factor/2", "QUORUM = (replication_factor/2) +1", "QUORUM = replication_factor -1 + (0.5*replication_factor)", "Ninguna de las opciones", "QUORUM = replication_factor*2"], "correct": [3], "why": ""}, {"stmt": "27. Considerando el siguiente esquema de BD, definir en MySQL la vista \"ConstructorVIP\" conteniendo el identificador del constructor, la cantidad de obras privadas actualmente en ejecución y el monto total de los presupuestos de dichas obras, solo si superan el millón de dólares. ¿La vista es actualizable? Justifique brevemente su respuesta.", "img": ["bd2-parcial-2025-esquema-obras.png"], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\nEl presupuesto está en EJECUTA (constructor que ejecuta una obra). Se filtran las obras privadas sin `anio_finalizacion`:\n\n```sql\nCREATE VIEW ConstructorVIP AS\nSELECT e.tipo_doc, e.nro_doc,\n       COUNT(*)           AS cant_obras_privadas,\n       SUM(e.presupuesto) AS total_presupuesto\nFROM ejecuta e\nJOIN obra o          ON o.id_obra  = e.id_obra\nJOIN obra_privada op ON op.id_obra = o.id_obra\nWHERE o.anio_finalizacion IS NULL\nGROUP BY e.tipo_doc, e.nro_doc\nHAVING SUM(e.presupuesto) > 1000000;\n```\n\n**No es actualizable**: tiene funciones de agregación (COUNT, SUM), GROUP BY y HAVING. Una modificación sobre `total_presupuesto` no se puede propagar sin ambigüedad a las filas de EJECUTA.\n\n_Ver [[2_Vistas#Condiciones para que una vista sea actualizable]]._"}, {"stmt": "28. La arquitectura de Cassandra es Master-Slave.", "img": [], "mc": true, "opts": ["Verdadero", "Falso"], "correct": [1], "why": "_Es peer-to-peer: no hay nodos principales y cualquier nodo puede ser coordinador._"}, {"stmt": "29. Explique cómo se constituye una Primary Key en Cassandra y qué función cumple cada componente. Incluya ejemplos en su explicación.", "img": [], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\nLa primary key tiene dos partes y el orden importa:\n\n- **Partition key**: el primer componente. Se hashea para obtener el token que decide en qué nodo se guarda la fila. Las filas con la misma partition key quedan juntas en la misma partición. Puede ser compuesta, con paréntesis extra.\n- **Clustering key**: el resto de los componentes. Define el orden físico de las filas dentro de la partición, y por eso solo se puede hacer ORDER BY sobre ella.\n\nEjemplos:\n\n- `PRIMARY KEY (idusuario)`: partition key idusuario, sin clustering key; cada partición tiene una sola fila.\n- `PRIMARY KEY (mes, nombre)`: partition key mes, clustering key nombre; todas las filas de un mes juntas, ordenadas por nombre.\n- `PRIMARY KEY ((idusuario, mes), nombre, registro)`: partition key compuesta; en el WHERE hay que dar idusuario y mes.\n\n_Ver [[8_Cassandra#Clave primaria: partition key y clustering key]]._"}, {"stmt": "30. Considere en MySQL las tablas a continuación con sus atributos y datos relevantes, con sus claves primarias, sus restricciones de integridad referencial (RIR) y acciones referenciales de [baja, modificación]. Determine el resultado de la ejecución de la siguiente operación.\nR1: Carrera (idFac) << Facultad (idFac): [restrict, restrict]\nR2: Materia (carrera, facultad) << Carrera (idCarr, idFac): [restrict, cascade]\nNota: respecto de la RIR R2, suponga que los atributos carrera y facultad admiten nulos.\n```sql\nDELETE FROM Carrera WHERE idCarr = 2;\n```", "img": ["bd2-parcial-2025-tablas-rir.png"], "mc": true, "opts": ["Procede", "No procede por RIR R1", "No procede por RIR R2"], "correct": [2], "why": "_Se borraría la carrera (2, F2), que está referenciada por la materia M3, y la baja en R2 es restrict. R1 no aplica: Carrera es la que referencia a Facultad, no al revés._"}, {"stmt": "31. Explique las ventajas y desventajas de implementar un modelo embebido vs. no hacerlo en MongoDB.", "img": [], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\n**Embebido** (subdocumentos dentro del mismo documento):\n\n- Ventajas: se lee todo en una sola consulta, sin `$lookup`, y la escritura de un documento es atómica.\n- Desventajas: duplica datos si lo embebido se comparte (hay que actualizarlo en todos lados), el documento puede crecer sin límite y tiene un tope de 16 MB.\n\n**Normalizado** (referencias por `_id`):\n\n- Ventajas: no duplica, sirve para many-to-many y jerarquías grandes, los documentos quedan chicos.\n- Desventajas: hacen falta varias consultas o `$lookup`, y actualizar varios documentos no es atómico.\n\nConviene embeber en relaciones \"contiene\", one-to-one u one-to-few que se leen juntas.\n\n_Ver [[7_MongoDB#Modelado: embebido vs normalizado]]._"}, {"stmt": "32. Dada la siguiente secuencia de cesión, revocación de privilegios y operaciones en SQL estándar, decir cuáles son los privilegios y sobre qué objetos los conservan U0, U1, U2 y U3 al final. Nota: U0 es admin; Cliente es una tabla; CS: ClienteSub-30, CSV: ClienteSub-30Vip, ambos son vistas.\n```sql\nU0: GRANT SELECT ON CS, CSV TO U1;\nU0: GRANT INSERT, UPDATE ON CLIENTE TO U1 WITH GRANT OPTION;\nU0: UPDATE CS SET Tipo = \"Vip\" WHERE Nombre = \"Esteban Gonzalez\";\nU0: GRANT SELECT ON CLIENTE TO U1, U2 WITH GRANT OPTION;\nU1: GRANT SELECT ON CLIENTE TO U3 WITH GRANT OPTION;\nU3: GRANT SELECT ON CLIENTE TO U2;\nU0: GRANT SELECT ON CSV TO U2;\nU1: REVOKE SELECT ON CLIENTE FROM U3 CASCADE;\n```", "img": [], "mc": false, "ansimg": [], "ans": "_Resolución propia: el PDF no trae la respuesta de las preguntas a desarrollar._\n\n- **U0**: todos los privilegios sobre todo (es admin). El UPDATE sobre CS es una operación, no cambia privilegios.\n- **U1**: SELECT sobre CS y CSV; INSERT, UPDATE y SELECT sobre Cliente, los tres WITH GRANT OPTION.\n- **U2**: SELECT sobre Cliente WITH GRANT OPTION (el que le dio U0) y SELECT sobre CSV.\n- **U3**: nada.\n\nEl REVOKE CASCADE le saca a U3 el SELECT sobre Cliente y arrastra el que U3 le había dado a U2. Pero U2 conserva el SELECT que le dio U0 directamente."}, {"stmt": "33. ¿Cuál de las siguientes bases delega el mecanismo de coordinación de nodos en una herramienta externa? Por ejemplo, el reemplazo de nodo maestro caído por un nodo esclavo preparado.", "img": [], "mc": true, "opts": ["MySQL", "Cassandra", "Neo4j", "MongoDB", "Ninguna de las opciones."], "correct": [2], "why": ""}]</script>
<script>
const Q = JSON.parse(document.getElementById('datos').textContent);
const KEY = 'bd2-sim-1P_2025_2C';
const IMG = JSON.parse(document.getElementById('imgs').textContent);
const letra = i => String.fromCharCode(97 + i);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// markdown minimo: bloques de codigo, viñetas, negritas, `codigo`, _linea en italica_ y wikilinks
function inline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/^_(.+)_$/, '<em>$1</em>')
          .replace(/\[\[([^\]|#]+)(?:#([^\]|]+))?(?:\|[^\]]+)?\]\]/g, (m, a, b) => b ? a + ' › ' + b : a);
}
function fmt(s) {
  let html = '', lista = false, code = null;
  for (const ln of esc(s).split('\n')) {
    if (/^```/.test(ln.trim())) {
      if (code === null) { if (lista) { html += '</ul>'; lista = false; } code = []; }
      else { html += '<pre><code>' + code.join('\n') + '</code></pre>'; code = null; }
      continue;
    }
    if (code !== null) { code.push(ln); continue; }
    const item = ln.match(/^-\s+(.*)$/);
    if (item) { if (!lista) { html += '<ul>'; lista = true; } html += '<li>' + inline(item[1]) + '</li>'; }
    else { if (lista) { html += '</ul>'; lista = false; } if (ln.trim()) html += '<p>' + inline(ln) + '</p>'; }
  }
  if (lista) html += '</ul>';
  if (code !== null) html += '<pre><code>' + code.join('\n') + '</code></pre>';
  return html;
}

// est[i] = {sel:[], txt:'', shown:bool, ok:true|false|null}
let est = {}, orden = Q.map((_, i) => i), idx = 0, fin = false;
function cargar() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.est) { est = s.est; orden = s.orden || orden; idx = s.idx || 0; }
  } catch (e) {}
}
function guardar() { try { localStorage.setItem(KEY, JSON.stringify({ est, orden, idx })); } catch (e) {} }
const st = i => est[i] || (est[i] = { sel: [], txt: '', shown: false, ok: null });

const pantalla = document.getElementById('pantalla');
const pos = document.getElementById('pos');
const fill = document.getElementById('fill');

function contar() {
  let ok = 0, mal = 0;
  orden.forEach(i => { const s = est[i]; if (!s || s.ok === null) return; s.ok ? ok++ : mal++; });
  return { ok, mal, faltan: orden.length - ok - mal };
}

function cabecera() {
  const c = contar();
  if (fin) { pos.innerHTML = ''; fill.style.width = '100%'; return; }
  pos.innerHTML = `<span>Pregunta <b>${idx + 1}</b> de <b>${orden.length}</b></span>
                   <span>Contestadas <b>${orden.length - c.faltan}</b></span>`;
  fill.style.width = ((idx + 1) / orden.length * 100) + '%';
}

function pintarQ() {
  const qi = orden[idx], q = Q[qi], s = st(qi);
  const multi = q.mc && q.correct.length > 1;
  const box = document.createElement('div');
  box.className = 'card';
  const imgs = (q.img || []).map(f => `<img src="${IMG[f] || ""}" alt="Imagen del enunciado">`).join('');
  box.innerHTML = `<div class="prompt">${fmt(q.stmt)}</div>${imgs}
    ${q.mc ? '<ul class="opts"></ul>' : '<textarea placeholder="Escribí tu respuesta…"></textarea>'}
    <div class="fb" hidden></div>
    <div class="acts"></div>`;
  const fb = box.querySelector('.fb'), acts = box.querySelector('.acts');

  const bAnt = document.createElement('button'); bAnt.textContent = 'Anterior';
  const bSig = document.createElement('button'); bSig.textContent = 'Siguiente';
  const bVer = document.createElement('button'); bVer.className = 'primary';
  bVer.textContent = q.mc ? 'Comprobar' : 'Ver respuesta';
  bAnt.disabled = idx === 0;
  bAnt.onclick = () => { idx--; guardar(); dibujar(); };
  bSig.onclick = () => { if (idx < orden.length - 1) { idx++; guardar(); dibujar(); } else terminar(); };
  if (idx === orden.length - 1) { bSig.textContent = 'Terminar'; bSig.classList.add('primary'); }

  // limpia el veredicto en cuanto la respuesta cambia: nunca queda pegado en rojo
  const limpiar = () => { s.shown = false; s.ok = null; };

  if (q.mc) {
    const ul = box.querySelector('.opts');
    q.opts.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'opt'; li.tabIndex = 0;
      li.setAttribute('role', multi ? 'checkbox' : 'radio');
      li.innerHTML = `<span class="dot${multi ? '' : ' round'}"></span><span class="ltr">${letra(i)})</span><span>${esc(t)}</span>`;
      const toggle = () => {
        if (multi) { const k = s.sel.indexOf(i); k < 0 ? s.sel.push(i) : s.sel.splice(k, 1); }
        else s.sel = s.sel[0] === i ? [] : [i];
        limpiar(); pintar(); guardar(); cabecera();
      };
      li.onclick = toggle;
      li.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } };
      ul.appendChild(li);
    });
    bVer.onclick = () => {
      if (!s.sel.length) return;
      s.shown = true;
      s.ok = s.sel.length === q.correct.length && q.correct.every(i => s.sel.includes(i));
      pintar(); guardar(); cabecera();
    };
    acts.append(bAnt, bVer, bSig);

    var pintar = () => {
      [...ul.children].forEach((li, i) => {
        li.className = 'opt' + (s.sel.includes(i) ? ' sel' : '');
        li.setAttribute('aria-checked', s.sel.includes(i));
        if (s.shown) {
          const bien = q.correct.includes(i), eleg = s.sel.includes(i);
          if (bien && eleg) li.classList.add('hit');
          else if (bien) li.classList.add('miss');
          else if (eleg) li.classList.add('wrong');
        }
      });
      fb.hidden = !s.shown;
      fb.className = 'fb' + (s.shown ? (s.ok ? ' ok' : ' bad') : '');
      if (s.shown) fb.innerHTML = `<strong>${s.ok ? 'Correcta' : 'Incorrecta'}</strong>
        <p>${q.correct.map(i => letra(i) + ') ' + esc(q.opts[i])).join(' · ')}</p>
        ${q.why ? '<div class="why">' + fmt(q.why) + '</div>' : ''}`;
      bVer.disabled = !s.sel.length;
      bVer.textContent = s.shown ? 'Comprobada' : 'Comprobar';
      bVer.classList.toggle('primary', !s.shown);
    };
  } else {
    const ta = box.querySelector('textarea');
    ta.value = s.txt || '';
    ta.oninput = () => { s.txt = ta.value; guardar(); };
    bVer.onclick = () => { s.shown = true; pintar(); guardar(); };
    acts.append(bAnt, bVer, bSig);

    var pintar = () => {
      fb.hidden = !s.shown;
      fb.className = 'fb' + (s.shown && s.ok !== null ? (s.ok ? ' ok' : ' bad') : '');
      if (s.shown) {
        const ai = (q.ansimg || []).map(f => `<img src="${IMG[f] || ""}" alt="Imagen de la respuesta">`).join('');
        fb.innerHTML = `<strong>Respuesta</strong>${fmt(q.ans)}${ai}
          <div class="self"><span>¿Cómo te fue?</span></div>`;
        const self = fb.querySelector('.self');
        [['La tuve bien', true], ['La tuve mal', false]].forEach(([t, v]) => {
          const b = document.createElement('button');
          b.textContent = t;
          b.className = s.ok === v ? 'on' : '';
          b.onclick = () => { s.ok = s.ok === v ? null : v; pintar(); guardar(); cabecera(); };
          self.appendChild(b);
        });
      }
      bVer.hidden = s.shown;
    };
  }
  pintar();
  pantalla.textContent = '';
  pantalla.appendChild(box);
}

function terminar() {
  fin = true; guardar(); dibujar();
}

function pintarRes() {
  const c = contar();
  const malas = orden.filter(i => est[i] && est[i].ok === false);
  const sinHacer = orden.filter(i => !est[i] || est[i].ok === null);
  const box = document.createElement('div');
  box.className = 'card res';
  box.innerHTML = `<h2>Resultado</h2>
    <div class="nums">
      <div class="g"><b>${c.ok}</b><span>acertadas</span></div>
      <div class="r"><b>${c.mal}</b><span>erradas</span></div>
      <div><b>${c.faltan}</b><span>sin contestar</span></div>
      <div><b>${c.ok + c.mal ? Math.round(c.ok / (c.ok + c.mal) * 100) : 0}%</b><span>de las contestadas</span></div>
    </div>
    <p></p><div class="acts"></div>`;
  box.querySelector('p').textContent = malas.length
    ? `Podés volver a hacer solo las ${malas.length} que erraste: se borran esas respuestas y arrancás una vuelta nueva con ellas.`
    : c.faltan ? 'No erraste ninguna de las que contestaste.' : 'No erraste ninguna.';
  const acts = box.querySelector('.acts');
  if (malas.length) {
    const b = document.createElement('button'); b.className = 'primary';
    b.textContent = `Rehacer las ${malas.length} que erré`;
    b.onclick = () => {
      malas.forEach(i => { est[i] = { sel: [], txt: '', shown: false, ok: null }; });
      orden = malas; idx = 0; fin = false; guardar(); dibujar(); scrollTo(0, 0);
    };
    acts.appendChild(b);
  }
  if (sinHacer.length) {
    const b = document.createElement('button');
    b.textContent = `Seguir con las ${sinHacer.length} que faltan`;
    b.onclick = () => { orden = sinHacer; idx = 0; fin = false; guardar(); dibujar(); scrollTo(0, 0); };
    acts.appendChild(b);
  }
  const rev = document.createElement('button');
  rev.textContent = 'Repasar estas preguntas';
  rev.onclick = () => { idx = 0; fin = false; guardar(); dibujar(); scrollTo(0, 0); };
  const todo = document.createElement('button');
  todo.textContent = 'Empezar de nuevo';
  todo.onclick = reiniciar;
  acts.append(rev, todo);
  pantalla.textContent = '';
  pantalla.appendChild(box);
}

function dibujar() { cabecera(); fin ? pintarRes() : pintarQ(); }

function reiniciar() {
  if (!confirm('Se borran todas tus respuestas. ¿Seguís?')) return;
  est = {}; orden = Q.map((_, i) => i); idx = 0; fin = false; guardar(); dibujar(); scrollTo(0, 0);
}
document.getElementById('reiniciar').onclick = reiniciar;
document.getElementById('terminar').onclick = terminar;
document.getElementById('mezclar').onclick = () => {
  for (let i = orden.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [orden[i], orden[j]] = [orden[j], orden[i]]; }
  idx = 0; fin = false; guardar(); dibujar(); scrollTo(0, 0);
};
addEventListener('keydown', e => {
  if (fin || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' && idx < orden.length - 1) { idx++; guardar(); dibujar(); }
  if (e.key === 'ArrowLeft' && idx > 0) { idx--; guardar(); dibujar(); }
});

const btema = document.getElementById('tema');
const aplicar = t => { document.documentElement.dataset.theme = t; btema.textContent = t === 'dark' ? 'Modo claro' : 'Modo oscuro'; };
let tguardado = null;
try { tguardado = localStorage.getItem(KEY + '-tema'); } catch (e) {}
if (tguardado) aplicar(tguardado);
else btema.textContent = matchMedia('(prefers-color-scheme: dark)').matches ? 'Modo claro' : 'Modo oscuro';
btema.onclick = () => {
  const act = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nue = act === 'dark' ? 'light' : 'dark';
  aplicar(nue);
  try { localStorage.setItem(KEY + '-tema', nue); } catch (e) {}
};

cargar();
if (idx >= orden.length) idx = 0;
dibujar();
</script>
</body>
</html>
